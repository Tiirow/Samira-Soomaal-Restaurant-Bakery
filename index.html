    /* ============================================================
       SAMIRA SOOMAAL — PREMIUM BRAND SYSTEM
       ============================================================ */
    :root{
      --samira-black:#101010;
      --samira-dark:#171717;
      --samira-gold:#F2B705;
      --samira-gold-2:#FFD84A;
      --samira-orange:#E08D00;
      --samira-cream:#FFFDF8;
      --samira-line:#E8E0D5;
    }

    body{
      background:
        radial-gradient(circle at 10% 0%, rgba(242,183,5,.08), transparent 28%),
        linear-gradient(180deg,#fffdf8 0%,#f8f4ed 100%);
    }

    .brand-mark{
      background:linear-gradient(145deg,#F2B705 0%,#D99400 100%);
      border:2px solid rgba(255,255,255,.75);
      box-shadow:0 10px 30px rgba(242,183,5,.28);
    }
    .brand-mark-letter{
      font-family:Georgia,serif;
      font-size:30px;
      line-height:1;
      font-weight:900;
      color:#101010;
      font-style:italic;
    }

    .samira-hero{
      background:
        radial-gradient(circle at 75% 20%, rgba(242,183,5,.20), transparent 30%),
        radial-gradient(circle at 15% 90%, rgba(242,183,5,.10), transparent 30%),
        linear-gradient(135deg,#0b0b0b 0%,#151515 55%,#1d1d1d 100%);
    }
    .hero-glow{
      box-shadow:0 0 0 1px rgba(242,183,5,.25),0 30px 80px rgba(0,0,0,.42);
    }
    .gold-line{
      height:3px;
      width:84px;
      background:linear-gradient(90deg,#F2B705,#FFD84A);
      border-radius:999px;
    }
    .brand-wordmark{
      letter-spacing:-.055em;
      text-shadow:0 2px 0 rgba(0,0,0,.08);
    }
    .hero-photo{
      transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .8s ease;
    }
    .hero-photo:hover{
      transform:scale(1.035);
      filter:saturate(1.08);
    }
    .promo-card{
      background:linear-gradient(135deg,#f2b705,#e08d00);
      color:#101010;
      box-shadow:0 18px 50px rgba(224,141,0,.24);
    }
    .luxury-card{
      background:linear-gradient(145deg,#121212,#1d1d1d);
      border:1px solid rgba(242,183,5,.25);
    }
    .photo-frame{
      position:relative;
      overflow:hidden;
      border-radius:28px;
      box-shadow:0 25px 70px rgba(16,16,16,.20);
    }
    .photo-frame:after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.48));
      pointer-events:none;
    }
    .shine{
      position:relative;
      overflow:hidden;
    }
    .shine:after{
      content:"";
      position:absolute;
      top:-100%;
      left:-60%;
      width:45%;
      height:300%;
      transform:rotate(22deg);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
      animation:samiraShine 5.5s infinite;
      pointer-events:none;
    }
    @keyframes samiraShine{
      0%,65%{left:-60%}
      100%{left:135%}
    }
    .floating-badge{
      animation:samiraFloat 4s ease-in-out infinite;
    }
    @keyframes samiraFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-8px)}
    }
    .section-kicker{
      color:#B77900;
      letter-spacing:.18em;
    }
    .samira-grid{
      background-image:linear-gradient(rgba(242,183,5,.07) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(242,183,5,.07) 1px,transparent 1px);
      background-size:26px 26px;
    }
    @media (max-width:640px){
      .brand-wordmark{font-size:1.35rem}
    }


    /* ============================================================
       SAMIRA SOOMAAL — SCREENSHOT MATCH DESIGN
       Target: supplied Samira Soomaal homepage screenshot
       ============================================================ */
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #f6f4f0;
      color: #111111;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .ss-header {
      background: rgba(15,15,15,.98);
      border-bottom: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 4px 20px rgba(0,0,0,.18);
    }
    .ss-nav-link {
      position: relative;
      color: #f7f7f7;
      font-size: 13px;
      font-weight: 600;
      padding: 24px 4px 21px;
      transition: color .2s ease;
    }
    .ss-nav-link:hover, .ss-nav-link.active { color: #F7B900; }
    .ss-nav-link.active:after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 13px;
      height: 2px;
      background: #F7B900;
      border-radius: 99px;
    }
    .ss-order-btn {
      background: #F7B900;
      color: #111;
      font-weight: 800;
      border-radius: 12px;
      padding: 10px 20px;
      box-shadow: 0 7px 18px rgba(247,185,0,.18);
      transition: transform .2s ease, filter .2s ease;
    }
    .ss-order-btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .ss-hero {
      min-height: 350px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: #090909;
    }

    /* Supplied Samira Soomaal branch photo — professionally positioned on the right */
    .ss-hero:before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 60%;
      z-index: 0;
      background-image: var(--ss-hero-image);
      background-size: cover;
      background-position: center 56%;
      background-repeat: no-repeat;
      filter: saturate(1.04) contrast(1.02);
      transform: scale(1.015);
    }

    /* Dark luxury gradient keeps the text highly readable while revealing the photo */
    .ss-hero:after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(
          90deg,
          rgba(7,7,7,1) 0%,
          rgba(7,7,7,.98) 24%,
          rgba(7,7,7,.88) 39%,
          rgba(7,7,7,.58) 53%,
          rgba(7,7,7,.18) 72%,
          rgba(7,7,7,.08) 100%
        ),
        linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.28));
      pointer-events: none;
    }
    .ss-hero-inner { position: relative; z-index: 2; }
    .ss-brand-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 900;
      letter-spacing: -.035em;
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 0 3px 0 rgba(0,0,0,.2);
    }
    .ss-gold { color: #F7B900; }
    .ss-cream { color: #fffaf0; }
    .ss-hero-line { height: 3px; background: #F7B900; border-radius: 999px; }
    .ss-hero-sub { letter-spacing: .30em; font-weight: 900; }
    .ss-yellow-btn {
      background: #F7B900;
      color: #111;
      border-radius: 24px;
      font-weight: 800;
      padding: 11px 22px;
      transition: transform .2s ease, filter .2s ease;
    }
    .ss-yellow-btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .ss-outline-btn {
      color: white;
      border: 2px solid #fff3c4;
      border-radius: 24px;
      font-weight: 700;
      padding: 9px 21px;
      background: rgba(0,0,0,.14);
    }
    .ss-info-strip { background: #fff; border-bottom: 1px solid #e9e5dd; }
    .ss-info-item { min-height: 76px; display:flex; align-items:center; gap:12px; }
    .ss-info-icon {
      width: 44px; height:44px; border-radius:50%; background:#F7B900; color:#111;
      display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    }
    .ss-divider { width:1px; height:42px; background:#e1ddd5; }
    .ss-dark-section { background: #121212; color: #fff; }
    .ss-section-wrap { max-width: 1400px; margin: 0 auto; padding: 28px 42px; }
    .ss-kicker { color:#F7B900; font-size:12px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; }
    .ss-heading { font-size:29px; line-height:1.05; font-weight:900; letter-spacing:-.03em; }
    .ss-heading .accent { color:#F7B900; }
    .ss-menu-card {
      background:#171717; border:1px solid #5b5549; border-radius:10px; overflow:hidden;
      transition: transform .2s ease, border-color .2s ease;
    }
    .ss-menu-card:hover { transform: translateY(-2px); border-color:#F7B900; }
    .ss-menu-card img { width:100%; height:112px; object-fit:cover; display:block; }
    .ss-menu-card-body { padding:10px 12px 12px; }
    .ss-menu-card-title { font-size:14px; font-weight:800; }
    .ss-menu-card-sub { color:#d3d0c9; font-size:10px; margin-top:2px; }
    .ss-round-arrow { width:17px; height:17px; border-radius:50%; background:#F7B900; color:#111; display:flex; align-items:center; justify-content:center; }
    .ss-light-section { background:#f8f6f2; }
    .ss-fav-card { background:#fff; border:1px solid #ddd9d0; border-radius:10px; padding:5px 5px 8px; box-shadow:0 2px 10px rgba(0,0,0,.07); }
    .ss-fav-img { height:104px; width:100%; object-fit:cover; border-radius:7px; }
    .ss-fav-title { font-size:12px; font-weight:700; margin:7px 4px 2px; }
    .ss-fav-price { font-size:12px; font-weight:900; margin:0 4px 7px; }
    .ss-add-btn { width:100%; background:#F7B900; color:#111; border-radius:8px; padding:7px 5px; font-size:10px; font-weight:800; }
    .ss-banner {
      background: linear-gradient(100deg,#111 0%,#171717 60%,#090909 100%);
      border-radius:12px; overflow:hidden; position:relative; min-height:94px; border:1px solid #272727;
    }
    .ss-banner-title { font-family:cursive; font-style:italic; font-weight:900; font-size:31px; line-height:.95; }
    .ss-banner-food { position:absolute; right:0; bottom:0; width:39%; height:100%; object-fit:cover; object-position:center; opacity:.96; }
    .ss-banner-overlay { position:absolute; inset:0; background:linear-gradient(90deg,#111 0%,rgba(17,17,17,.94) 48%,rgba(17,17,17,.25) 75%,rgba(17,17,17,.05) 100%); }
    .ss-location-card { background:#fff; border:1px solid #dedbd4; border-radius:9px; min-height:62px; padding:8px 10px; display:flex; align-items:center; gap:9px; }
    .ss-location-thumb { width:46px; height:46px; border-radius:7px; object-fit:cover; flex:0 0 auto; }
    .ss-map { min-height:100px; border-radius:8px; background-color:#efede8; background-image:linear-gradient(32deg,transparent 45%,#e2dfd7 46%,#e2dfd7 49%,transparent 50%),linear-gradient(145deg,transparent 45%,#e2dfd7 46%,#e2dfd7 49%,transparent 50%); position:relative; overflow:hidden; }
    .ss-map:before { content:''; position:absolute; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.48); left:55%; top:12px; }
    .ss-footer { background:#121212; color:#fff; border-top:1px solid #2b2b2b; }
    .ss-social { width:24px; height:24px; border:1px solid #777; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff; }
    .ss-mobile-menu { background:#111; border-top:1px solid #333; }
    @media (max-width: 900px) {
      .ss-nav-desktop { display:none; }
      .ss-section-wrap { padding:24px 18px; }
      .ss-hero { min-height:430px; }
      .ss-hero:before { width:68%; background-position:center 56%; }
      .ss-info-item { min-height:64px; }
      .ss-divider { display:none; }
      .ss-banner-food { width:48%; opacity:.65; }
    }
    @media (max-width: 640px) {
      .ss-hero { min-height:510px; }
      .ss-hero:before { width:100%; background-position:center 58%; opacity:.42; }
      .ss-hero:after { background:linear-gradient(90deg,rgba(7,7,7,.97) 0%,rgba(7,7,7,.88) 45%,rgba(7,7,7,.48) 100%),linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.34)); }
      .ss-hero .max-w-7xl { padding-left:18px; padding-right:18px; }
      .ss-brand-title { font-size:3.2rem; }
      .ss-heading { font-size:24px; }
      .ss-menu-card img { height:96px; }
      .ss-banner-title { font-size:24px; }
      .ss-banner-food { display:none; }
    }

  </style>
</head>
